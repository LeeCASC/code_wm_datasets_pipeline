[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cwm-minimax-h3-inference"
version = "0.1.0"
description = "MiniMax H3 Ref2VA inference with a fixed first frame and Retake34 continuation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "CWM contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "av==14.0.1",
  "numpy>=1.26",
  "pillow>=11.3.0",
  "safetensors==0.4.5",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
cwm-h3-inference = "cwm_h3_inference.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cwm_h3_inference"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/ENVIRONMENT.md",
  "/INFERENCE.md",
  "/patches",
  "/scripts",
  "/requirements-h800-cu128-py310.txt",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
  "/THIRD_PARTY_NOTICES.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
